name: FastF1 Latest Race to MotherDuck

on:
  schedule:
    - cron: "0 6 * * 2"  # Tuesday 6am UTC — after most race weekends conclude
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest race
        env:
          SEASON: "2026"
        run: python import_latest_fastf1_data.py

      - name: Upload to MotherDuck
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          SEASON: "2026"
        run: python upload_to_motherduck_weekly.py
